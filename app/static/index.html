<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>おんどく ボイス</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="kid">
  <header class="topbar">
    <span class="brand">おんどく ボイス</span>
    <span id="who" class="who"></span>
    <button id="logout" class="link hidden" type="button">おわる</button>
  </header>

  <main>
    <!-- 1. ログイン -->
    <section id="view-login" class="card narrow hidden">
      <h1>ようこそ</h1>
      <p>せんせいから もらった ID と あいことば を いれてね。</p>
      <form id="login-form" autocomplete="off">
        <label>ID <input id="login-id" inputmode="latin" autocapitalize="characters" required></label>
        <label>あいことば <input id="login-pass" type="password" autocapitalize="off" required></label>
        <button class="big primary" type="submit">はじめる</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <!-- 2. 声の登録 -->
    <section id="view-record" class="card hidden">
      <h1>あなたの こえを ろくおん しよう</h1>
      <ol class="steps">
        <li>「ろくおん」を おして、したの ぶんを ゆっくり よんでね。</li>
        <li>よみおわったら「とめる」を おしてね。</li>
        <li>きいて みて、よければ「おくる」を おしてね。</li>
      </ol>
      <div id="script" class="script"></div>

      <div class="recorder">
        <div class="meter" aria-hidden="true"><div id="meter-bar"></div></div>
        <div id="rec-time" class="rec-time">0.0 びょう</div>
        <div class="row">
          <button id="rec-start" class="big record" type="button">● ろくおん</button>
          <button id="rec-stop" class="big hidden" type="button">■ とめる</button>
        </div>
        <div id="rec-review" class="hidden">
          <audio id="rec-audio" controls controlsList="nodownload"></audio>
          <p id="rec-check" class="notice"></p>
          <div class="row">
            <button id="rec-redo" class="big" type="button">もういちど</button>
            <button id="rec-send" class="big primary" type="button">おくる</button>
          </div>
        </div>
        <p id="rec-error" class="error" role="alert"></p>
      </div>

      <details class="upload">
        <summary>マイクが つかえない ときは（ファイルを えらぶ）</summary>
        <p>ろくおん した おんせい ファイル（WAV・MP3・M4A など）を えらんでね。</p>
        <input id="file-input" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg">
      </details>
      <button id="rec-cancel" class="link hidden" type="button">← もどる</button>
    </section>

    <!-- 3. 練習 -->
    <section id="view-practice" class="hidden">
      <div id="progress" class="card notice-card hidden"></div>
      <div id="items"></div>
      <p class="small center">
        <button id="re-record" class="link" type="button">こえを とりなおす</button>
      </p>
    </section>
  </main>

  <template id="item-tpl">
    <article class="card item">
      <div class="item-head">
        <span class="lang"></span>
        <span class="status"></span>
      </div>
      <p class="text"></p>
      <div class="controls">
        <button class="big primary play" type="button">▶ きく</button>
        <div class="speed" role="group" aria-label="はやさ">
          <button type="button" data-rate="0.75">ゆっくり</button>
          <button type="button" data-rate="1" class="on">ふつう</button>
        </div>
      </div>
      <div class="practice">
        <button class="self-rec" type="button">🎤 じぶんで よんで みる</button>
        <button class="self-play hidden" type="button">▶ じぶんの こえ</button>
        <span class="self-hint small"></span>
      </div>
    </article>
  </template>

  <script type="module" src="/static/participant.js"></script>
</body>
</html>
